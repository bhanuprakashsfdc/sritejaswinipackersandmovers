<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f172a; display: flex; align-items: center; justify-content: center; height: 100vh; }
    svg { width: 600px; height: 150px; }
  </style>
</head>
<body>
  <svg viewBox="0 0 600 150" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="truckGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#10b981" />
        <stop offset="100%" stop-color="#06b6d4" />
      </linearGradient>
      <linearGradient id="cabGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#059669" />
        <stop offset="100%" stop-color="#047857" />
      </linearGradient>
    </defs>

    <!-- Company Name -->
    <text x="300" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="white">Sri Tejaswini Packers & Movers</text>

    <!-- Truck Body -->
    <rect x="400" y="40" width="130" height="55" rx="5" fill="url(#truckGrad)" />
    
    <!-- Truck Cargo Lines -->
    <line x1="425" y1="45" x2="425" y2="90" stroke="white" stroke-width="1.5" opacity="0.3" />
    <line x1="455" y1="45" x2="455" y2="90" stroke="white" stroke-width="1.5" opacity="0.3" />
    <line x1="485" y1="45" x2="485" y2="90" stroke="white" stroke-width="1.5" opacity="0.3" />
    <line x1="515" y1="45" x2="515" y2="90" stroke="white" stroke-width="1.5" opacity="0.3" />
    
    <!-- Truck Back Door -->
    <rect x="530" y="48" width="4" height="40" fill="#047857" />
    
    <!-- Truck Cabin -->
    <rect x="530" y="50" width="45" height="40" rx="4" fill="url(#cabGrad)" />
    
    <!-- Truck Window -->
    <rect x="540" y="56" width="24" height="16" rx="3" fill="#a7f3d0" opacity="0.8" />
    
    <!-- Truck Wheels -->
    <circle cx="430" cy="98" r="11" fill="#1e293b" />
    <circle cx="430" cy="98" r="5.5" fill="#64748b" />
    <circle cx="555" cy="98" r="11" fill="#1e293b" />
    <circle cx="555" cy="98" r="5.5" fill="#64748b" />
    
    <!-- Ground Line -->
    <line x1="0" y1="109" x2="600" y2="109" stroke="#94a3b8" stroke-width="2" />

    <!-- Person 1 - Walking from left, entering truck -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 360,0; 360,0; 0,0" dur="4s" repeatCount="indefinite" />
      <!-- Head -->
      <circle cx="50" cy="52" r="8" fill="#fbbf24" />
      <!-- Body -->
      <line x1="50" y1="60" x2="50" y2="80" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
      <!-- Arms waving -->
      <line x1="50" y1="66" x2="40" y2="75" stroke="#10b981" stroke-width="3" stroke-linecap="round">
        <animate attributeName="x2" values="40;46;40" dur="0.5s" repeatCount="indefinite" />
        <animate attributeName="y2" values="75;72;75" dur="0.5s" repeatCount="indefinite" />
      </line>
      <line x1="50" y1="66" x2="60" y2="75" stroke="#10b981" stroke-width="3" stroke-linecap="round">
        <animate attributeName="x2" values="60;54;60" dur="0.5s" repeatCount="indefinite" />
        <animate attributeName="y2" values="75;72;75" dur="0.5s" repeatCount="indefinite" />
      </line>
      <!-- Legs -->
      <line x1="50" y1="80" x2="42" y2="105" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round">
        <animate attributeName="x2" values="42;54;42" dur="0.45s" repeatCount="indefinite" />
      </line>
      <line x1="50" y1="80" x2="58" y2="105" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round">
        <animate attributeName="x2" values="58;46;58" dur="0.45s" repeatCount="indefinite" />
      </line>
      <!-- Box -->
      <rect x="35" y="68" width="14" height="11" rx="2" fill="#f59e0b">
        <animate attributeName="y" values="68;65;68" dur="0.45s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Person 2 - Walking from left -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 320,0; 320,0; 0,0" dur="4.5s" repeatCount="indefinite" />
      <!-- Head -->
      <circle cx="120" cy="54" r="7" fill="#f9a8d4" />
      <!-- Body -->
      <line x1="120" y1="61" x2="120" y2="80" stroke="#06b6d4" stroke-width="3.5" stroke-linecap="round" />
      <!-- Arms -->
      <line x1="120" y1="66" x2="112" y2="75" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round">
        <animate attributeName="x2" values="112;118;112" dur="0.5s" repeatCount="indefinite" />
      </line>
      <line x1="120" y1="66" x2="128" y2="75" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round">
        <animate attributeName="x2" values="128;122;128" dur="0.5s" repeatCount="indefinite" />
      </line>
      <!-- Legs -->
      <line x1="120" y1="80" x2="113" y2="105" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round">
        <animate attributeName="x2" values="113;125;113" dur="0.5s" repeatCount="indefinite" />
      </line>
      <line x1="120" y1="80" x2="127" y2="105" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round">
        <animate attributeName="x2" values="127;115;127" dur="0.5s" repeatCount="indefinite" />
      </line>
    </g>

    <!-- Person 3 - Walking from left with box -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 280,0; 280,0; 0,0" dur="5s" repeatCount="indefinite" />
      <!-- Head -->
      <circle cx="190" cy="53" r="8" fill="#c4b5fd" />
      <!-- Body -->
      <line x1="190" y1="61" x2="190" y2="82" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round" />
      <!-- Arms -->
      <line x1="190" y1="67" x2="180" y2="76" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round">
        <animate attributeName="x2" values="180;186;180" dur="0.55s" repeatCount="indefinite" />
      </line>
      <line x1="190" y1="67" x2="200" y2="76" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round">
        <animate attributeName="x2" values="200;194;200" dur="0.55s" repeatCount="indefinite" />
      </line>
      <!-- Legs -->
      <line x1="190" y1="82" x2="182" y2="105" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round">
        <animate attributeName="x2" values="182;194;182" dur="0.48s" repeatCount="indefinite" />
      </line>
      <line x1="190" y1="82" x2="198" y2="105" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round">
        <animate attributeName="x2" values="198;186;198" dur="0.48s" repeatCount="indefinite" />
      </line>
      <!-- Box -->
      <rect x="198" y="68" width="15" height="12" rx="2" fill="#ef4444">
        <animate attributeName="y" values="68;65;68" dur="0.48s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Person 4 - Getting down from truck back -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; -50,20; -50,20; 0,0" dur="3.5s" repeatCount="indefinite" />
      <!-- Head -->
      <circle cx="540" cy="55" r="6" fill="#67e8f9" />
      <!-- Body -->
      <line x1="540" y1="61" x2="540" y2="78" stroke="#14b8a6" stroke-width="3" stroke-linecap="round" />
      <!-- Arms on truck -->
      <line x1="540" y1="65" x2="532" y2="72" stroke="#14b8a6" stroke-width="2" stroke-linecap="round">
        <animate attributeName="x2" values="532;536;532" dur="0.6s" repeatCount="indefinite" />
      </line>
      <line x1="540" y1="65" x2="548" y2="72" stroke="#14b8a6" stroke-width="2" stroke-linecap="round">
        <animate attributeName="x2" values="548;544;548" dur="0.6s" repeatCount="indefinite" />
      </line>
      <!-- Legs stepping down -->
      <line x1="540" y1="78" x2="535" y2="98" stroke="#1e293b" stroke-width="3" stroke-linecap="round">
        <animate attributeName="x2" values="535;540;535" dur="0.6s" repeatCount="indefinite" />
        <animate attributeName="y2" values="98;95;98" dur="0.6s" repeatCount="indefinite" />
      </line>
      <line x1="540" y1="78" x2="545" y2="98" stroke="#1e293b" stroke-width="3" stroke-linecap="round">
        <animate attributeName="x2" values="545;540;545" dur="0.6s" repeatCount="indefinite" />
        <animate attributeName="y2" values="98;95;98" dur="0.6s" repeatCount="indefinite" />
      </line>
    </g>

    <!-- Dotted path line -->
    <line x1="30" y1="118" x2="400" y2="118" stroke="#10b981" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.4" />
    
    <!-- Small dots along path -->
    <circle cx="80" cy="118" r="2" fill="#10b981" opacity="0.5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="160" cy="118" r="2" fill="#10b981" opacity="0.5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite" begin="0.3s" />
    </circle>
    <circle cx="240" cy="118" r="2" fill="#10b981" opacity="0.5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite" begin="0.6s" />
    </circle>
    <circle cx="320" cy="118" r="2" fill="#10b981" opacity="0.5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite" begin="0.9s" />
    </circle>

    <!-- Tagline -->
    <text x="300" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Safe & Reliable Relocation Services</text>
  </svg>
</body>
</html>
